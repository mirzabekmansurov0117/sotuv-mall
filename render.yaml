services:
  - type: web
    name: sotuv-mall
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@sotuv.uz
      - key: ADMIN_PASSWORD
        generateValue: true
